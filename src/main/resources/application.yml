spring:
  application:
    name: myTask
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mytask}
    username: ${DB_USERNAME:mytask}
    password: ${DB_PASSWORD:mytask}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_ENABLED:false}

mytask:
  reminder:
    cron: ${REMINDER_CRON:0 0 21 * * ?}
